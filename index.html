<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resizer</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;max-width:1050px;margin:32px auto;padding:0 16px;background:#f6f6f6;color:#222}.top{display:flex;justify-content:flex-end;gap:8px;align-items:center}.box{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin:18px 0}.drop{border:2px dashed #aaa;border-radius:10px;padding:26px;text-align:center;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;align-items:end}label{display:block;font-weight:700;margin-bottom:5px}input,select,button{font:inherit}input[type=number],input[type=file],select{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px;background:#fff}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{padding:9px 14px;border:1px solid #888;border-radius:8px;background:#fff;cursor:pointer}button.active{background:#222;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.note,.status,.meta{font-size:14px;color:#555}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{border:1px solid #ddd;border-radius:10px;padding:14px}.card img{width:100%;max-height:250px;object-fit:contain;border:1px solid #ddd;border-radius:8px;margin-bottom:10px}.card a{text-decoration:none}.card a button{width:100%;margin-top:8px}</style></head><body><div class="top"><label for="lang" id="langLabel">言語</label><select id="lang"><option value="ja">日本語</option><option value="en">English</option></select></div><h1 id="title">画像リサイズアプリ</h1><section class="box"><h2 id="selectTitle">画像を選択</h2><div class="drop" id="drop"><span id="dropText">ここに画像をドラッグ＆ドロップ</span><br><span id="orText">または</span><div style="margin-top:10px"><input id="files" type="file" accept="image/*" multiple></div></div><div class="grid"><div><label id="presetLabel">サイズプリセット</label><select id="preset"><option value="custom">カスタム</option><option value="l">L判写真（向き自動・中央トリミング）</option><option value="ll">L判写真・横（中央トリミング）</option><option value="yt">YouTube用サムネイル (1280×720)</option><option value="yb">YouTube用バナー (2048×1152)</option><option value="nt">note用サムネイル (1280×670)</option><option value="nb">note用バナー (1920×1006)</option><option value="kc">Kindle表紙 (1600×2560)</option></select></div><div><label id="wLabel">幅</label><input id="w" type="number" min="1"></div><div><label id="hLabel">高さ</label><input id="h" type="number" min="1"></div><div><label id="fmtLabel">出力形式</label><select id="fmt"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option></select></div><label class="check"><input id="suffix" type="checkbox" checked><span id="suffixLabel">ファイル名に _resized を付与</span></label></div><div class="buttons"><button id="autoL">L判に自動設定</button><button id="lock" class="active">縦横比を固定</button><button id="unlock">縦横比を解除</button><button id="resize">リサイズする</button><button id="zip" disabled>全部ZIPでダウンロード</button><button id="clear">選択をクリア</button></div><p class="note" id="note">複数画像をまとめて処理できます。縦横比固定中は片方を変更するともう一方も自動調整されます。</p><p class="status" id="count"></p><p class="status" id="status"></p></section><section class="box"><h2 id="origTitle">元画像</h2><div id="orig" class="list"></div></section><section class="box"><h2 id="outTitle">リサイズ後</h2><div id="out" class="list"></div></section><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script>const $=id=>document.getElementById(id),T={ja:{lang:'言語',title:'画像リサイズアプリ',select:'画像を選択',drop:'ここに画像をドラッグ＆ドロップ',or:'または',preset:'サイズプリセット',w:'幅',h:'高さ',fmt:'出力形式',suffix:'ファイル名に _resized を付与',auto:'L判に自動設定',lock:'縦横比を固定',unlock:'縦横比を解除',resize:'リサイズする',zip:'全部ZIPでダウンロード',clear:'選択をクリア',note:'複数画像をまとめて処理できます。縦横比固定中は片方を変更するともう一方も自動調整されます。',orig:'元画像',out:'リサイズ後',none:'画像はまだ選択されていません。',selected:n=>n+'件の画像を選択中です。',file:'ファイル名',size:'元サイズ',osize:'出力サイズ',format:'出力形式',mode:'処理方法',save:'保存名',download:'ダウンロード',working:'処理中です...',done:n=>n+'件の画像を処理しました。',need:'先に画像を選択してください。',bad:'幅と高さには1以上の数値を入力してください。',zipwork:'ZIPファイルを作成中です...',zipdone:'ZIPファイルをダウンロードしました。',fail:'画像処理に失敗しました。',zfail:'ZIPファイルの作成に失敗しました。',normal:'通常リサイズ',crop:'L判・中央トリミング'},en:{lang:'Language',title:'Image Resizer',select:'Select images',drop:'Drag and drop images here',or:'or',preset:'Size preset',w:'Width',h:'Height',fmt:'Output format',suffix:'Add _resized to filename',auto:'Auto-set L-size',lock:'Lock aspect ratio',unlock:'Unlock aspect ratio',resize:'Resize',zip:'Download all as ZIP',clear:'Clear selection',note:'You can process multiple images at once. When aspect ratio is locked, changing one dimension updates the other.',orig:'Original images',out:'Resized images',none:'No images selected yet.',selected:n=>n+' image(s) selected.',file:'Filename',size:'Original size',osize:'Output size',format:'Output format',mode:'Processing',save:'Saved name',download:'Download',working:'Processing...',done:n=>n+' image(s) processed.',need:'Select images first.',bad:'Width and height must be at least 1.',zipwork:'Creating ZIP...',zipdone:'ZIP downloaded.',fail:'Image processing failed.',zfail:'Failed to create ZIP.',normal:'Normal resize',crop:'L-size center crop'}};let lang=localStorage.getItem('imageResizerLang')||'ja',files=[],results=[],locked=true,ratio=null;function tx(k,...a){let v=T[lang][k];return typeof v==='function'?v(...a):v}function renderLang(){document.documentElement.lang=lang;$('lang').value=lang;$('langLabel').textContent=tx('lang');$('title').textContent=tx('title');$('selectTitle').textContent=tx('select');$('dropText').textContent=tx('drop');$('orText').textContent=tx('or');$('presetLabel').textContent=tx('preset');$('wLabel').textContent=tx('w');$('hLabel').textContent=tx('h');$('fmtLabel').textContent=tx('fmt');$('suffixLabel').textContent=tx('suffix');$('autoL').textContent=tx('auto');$('lock').textContent=tx('lock');$('unlock').textContent=tx('unlock');$('resize').textContent=tx('resize');$('zip').textContent=tx('zip');$('clear').textContent=tx('clear');$('note').textContent=tx('note');$('origTitle').textContent=tx('orig');$('outTitle').textContent=tx('out');updateCount();renderOriginal();renderResults()}function updateCount(){$('count').textContent=files.length?tx('selected',files.length):tx('none')}function setLock(v){locked=v;$('lock').classList.toggle('active',v);$('unlock').classList.toggle('active',!v)}function applyPreset(v){const p={l:[1051,1500],ll:[1500,1051],yt:[1280,720],yb:[2048,1152],nt:[1280,670],nb:[1920,1006],kc:[1600,2560]}[v];if(p){$('w').value=p[0];$('h').value=p[1];ratio=p[0]/p[1];if(v==='l'||v==='ll'||v==='kc')$('fmt').value='image/jpeg'}}function base(n){let i=n.lastIndexOf('.');return i>=0?n.slice(0,i):n}function ext(m){return m==='image/jpeg'?'jpg':'png'}function nameFor(n,m){return base(n)+($('suffix').checked?'_resized':'')+'.'+ext(m)}function handle(list){files=[...list].filter(f=>f.type.startsWith('image/'));results=[];$('zip').disabled=true;$('status').textContent='';renderOriginal();renderResults();updateCount()}function renderOriginal(){$('orig').innerHTML='';files.forEach((f,i)=>{let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{if(i===0){ratio=im.width/im.height;if(!$('w').value&&!$('h').value){$('w').value=im.width;$('h').value=im.height}}let c=document.createElement('div');c.className='card';c.innerHTML='<img><div class="meta"><b>'+tx('file')+':</b> '+f.name+'<br><b>'+tx('size')+':</b> '+im.width+' × '+im.height+'</div>';c.querySelector('img').src=r.result;$('orig').appendChild(c)};im.src=r.result};r.readAsDataURL(f)})}function crop(ctx,im,w,h){let sr=im.width/im.height,tr=w/h,x=0,y=0,sw=im.width,sh=im.height;if(sr>tr){sw=im.height*tr;x=(im.width-sw)/2}else if(sr<tr){sh=im.width/tr;y=(im.height-sh)/2}ctx.drawImage(im,x,y,sw,sh,0,0,w,h)}function one(f,w,h,m,lmode,llmode){return new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{let tw=w,th=h;if(lmode){if(llmode||im.width>im.height){tw=1500;th=1051}else{tw=1051;th=1500}}let c=document.createElement('canvas');c.width=tw;c.height=th;let x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';if(m==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,tw,th)}lmode?crop(x,im,tw,th):x.drawImage(im,0,0,tw,th);res({original:f.name,name:nameFor(f.name,m),mime:m,w:tw,h:th,mode:lmode?'crop':'normal',url:c.toDataURL(m,.92)})};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}function renderResults(){$('out').innerHTML='';results.forEach(v=>{let c=document.createElement('div');c.className='card';let a=document.createElement('a');a.href=v.url;a.download=v.name;a.innerHTML='<button>'+tx('download')+'</button>';c.innerHTML='<img><div class="meta"><b>'+tx('file')+':</b> '+v.original+'<br><b>'+tx('osize')+':</b> '+v.w+' × '+v.h+'<br><b>'+tx('format')+':</b> '+(v.mime==='image/jpeg'?'JPEG':'PNG')+'<br><b>'+tx('mode')+':</b> '+tx(v.mode)+'<br><b>'+tx('save')+':</b> '+v.name+'</div>';c.querySelector('img').src=v.url;c.appendChild(a);$('out').appendChild(c)})}$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('imageResizerLang',lang);renderLang()};$('files').onchange=e=>handle(e.target.files);$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();handle(e.dataTransfer.files)};$('preset').onchange=e=>applyPreset(e.target.value);$('autoL').onclick=()=>{$('preset').value='l';applyPreset('l')};$('lock').onclick=()=>setLock(true);$('unlock').onclick=()=>setLock(false);$('w').oninput=()=>{if(locked&&ratio&&+$('w').value)$('h').value=Math.round(+$('w').value/ratio)};$('h').oninput=()=>{if(locked&&ratio&&+$('h').value)$('w').value=Math.round(+$('h').value*ratio)};$('clear').onclick=()=>{files=[];results=[];$('files').value='';$('w').value='';$('h').value='';$('orig').innerHTML='';$('out').innerHTML='';$('status').textContent='';$('zip').disabled=true;updateCount()};$('resize').onclick=async()=>{if(!files.length)return alert(tx('need'));let w=+$('w').value,h=+$('h').value;if(w<1||h<1)return alert(tx('bad'));$('status').textContent=tx('working');results=[];let p=$('preset').value,l=p==='l'||p==='ll';try{for(let f of files)results.push(await one(f,w,h,$('fmt').value,l,p==='ll'));renderResults();$('zip').disabled=!results.length;$('status').textContent=tx('done',results.length)}catch(e){console.error(e);$('status').textContent=tx('fail')}};$('zip').onclick=async()=>{if(!results.length||typeof JSZip==='undefined')return;$('status').textContent=tx('zipwork');try{let z=new JSZip;for(let v of results){let b=await fetch(v.url).then(r=>r.blob());z.file(v.name,b)}let b=await z.generateAsync({type:'blob'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='resized_images.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('status').textContent=tx('zipdone')}catch(e){console.error(e);$('status').textContent=tx('zfail')}};setLock(true);renderLang();</script></body></html>
